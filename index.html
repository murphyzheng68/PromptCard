// ===== 数据层（IndexedDB）=====
const DB_NAME = 'promptcard';
const STORE = 'cards';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

function tx(mode) {
  return db.transaction(STORE, mode).objectStore(STORE);
}

function dbAll() {
  return new Promise((resolve) => {
    const req = tx('readonly').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function dbPut(card) {
  return new Promise((resolve) => {
    const req = tx('readwrite').put(card);
    req.onsuccess = () => resolve();
    req.onerror = () => resolve();
  });
}

function dbDelete(id) {
  return new Promise((resolve) => {
    const req = tx('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => resolve();
  });
}

// ===== 工具函数 =====
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();

function formatTime(ts) {
  const d = new Date(ts);
  const diff = Date.now() - d.getTime();
  const min = 60000, hour = 60 * min, day = 24 * hour;
  if (diff < min) return t('justNow');
  if (diff < hour) return t('minAgo', Math.floor(diff / min));
  if (diff < day) return t('hourAgo', Math.floor(diff / hour));
  if (diff < 7 * day) return t('dayAgo', Math.floor(diff / day));
  return d.toLocaleDateString(t('locale'));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

let _toastTimer = null;
function showToast(msg, actionLabel, actionFn) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = '';
  const textSpan = document.createElement('span');
  textSpan.textContent = msg;
  el.appendChild(textSpan);
  if (actionLabel && actionFn) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.onclick = () => {
      if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
      el.classList.add('toast-out');
      setTimeout(() => { el.style.display = 'none'; el.classList.remove('toast-out'); }, 250);
      actionFn();
    };
    el.appendChild(btn);
  }
  el.classList.remove('toast-out');
  el.style.display = 'flex';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    el.classList.add('toast-out');
    setTimeout(() => { el.style.display = 'none'; el.classList.remove('toast-out'); }, 250);
    _toastTimer = null;
  }, 3500);
}

// ===== 状态 =====
let cards = [];
let search = '';
let activeTag = '';
let editingTags = [];
let editingId = '';

// ===== 渲染 =====
async function loadCards() {
  cards = await dbAll();
  cards.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
  render();
  renderTags();
}

function render() {
  const list = document.getElementById('cardList');
  const empty = document.getElementById('empty');
  let filtered = cards;
  if (search) {
    const q = search.toLowerCase();
    filtered = filtered.filter(c =>
      (c.title || '').toLowerCase().includes(q) ||
      (c.content || '').toLowerCase().includes(q) ||
      (c.description || '').toLowerCase().includes(q)
    );
  }
  if (activeTag) {
    filtered = filtered.filter(c => (c.tags || []).includes(activeTag));
  }

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = filtered.map(c => `
    <div class="card-enter group bg-white border border-gray-200 rounded-xl p-5 hover:shadow-md hover:border-gray-300 transition flex flex-col">
      <div class="flex items-start justify-between mb-2">
        <h3 class="font-semibold text-sm leading-snug flex-1 line-clamp-2">${escapeHtml(c.title)}</h3>
        ${c.model ? `<span class="ml-2 shrink-0 px-2 py-0.5 bg-violet-50 text-violet-700 rounded text-[10px] font-mono">${escapeHtml(c.model)}</span>` : ''}
      </div>
      ${c.description ? `<p class="text-xs text-gray-500 mb-2 line-clamp-1">${escapeHtml(c.description)}</p>` : ''}
      <p class="text-xs text-gray-500 font-mono line-clamp-3 flex-1 mb-3">${escapeHtml(c.content)}</p>
      ${(c.tags || []).length > 0 ? `<div class="flex flex-wrap gap-1 mb-3">${c.tags.slice(0, 4).map(tag => `<span class="px-2 py-0.5 bg-gray-100 text-gray-500 rounded text-[10px]">#${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
      <div class="flex items-center justify-between pt-3 border-t border-gray-100">
        <span class="text-[10px] text-gray-400">${formatTime(c.updated_at || now())}</span>
        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
          <button onclick="copyCard('${c.id}')" class="p-1.5 hover:bg-gray-100 rounded text-gray-500" title="${t('copyTitle')}">${ICONS.copy}</button>
          <button onclick="shareImage('${c.id}')" class="p-1.5 hover:bg-gray-100 rounded text-gray-500" title="${t('shareTitle')}">${ICONS.image}</button>
          <button onclick="editCard('${c.id}')" class="p-1.5 hover:bg-gray-100 rounded text-gray-500" title="${t('editTitle')}">${ICONS.edit}</button>
          <button onclick="deleteCard('${c.id}')" class="p-1.5 hover:bg-red-50 rounded" title="${t('deleteTitle')}">${ICONS.trash}</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderTags() {
  const tagBar = document.getElementById('tagBar');
  const map = new Map();
  cards.forEach(c => (c.tags || []).forEach(tag => map.set(tag, (map.get(tag) || 0) + 1)));
  const tags = [...map.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);

  if (tags.length === 0) { tagBar.innerHTML = ''; return; }

  tagBar.innerHTML = `
    <button onclick="setTag('')" class="px-3 py-1 rounded-full text-xs font-medium transition ${!activeTag ? 'bg-violet-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}">${t('all')} (${cards.length})</button>
    ${tags.map(tag => `<button onclick="setTag('${escapeAttr(tag.name)}')" class="px-3 py-1 rounded-full text-xs font-medium transition ${activeTag === tag.name ? 'bg-violet-600 text-white' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}">${escapeHtml(tag.name)} (${tag.count})</button>`).join('')}
  `;
}

function setTag(tag) { activeTag = tag; render(); }

// ===== 操作 =====
window.copyCard = async (id) => {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  await navigator.clipboard.writeText(c.content);
  const btn = (typeof event !== 'undefined' && event && event.target) ? event.target.closest('button') : null;
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.innerHTML = ICONS.check; btn.title = t('copied'); }
  showToast(t('copied'));
  setTimeout(() => { if (btn) { btn.innerHTML = orig; btn.title = t('copyTitle'); } }, 1500);
};

window.shareImage = async (id) => {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  const btn = (typeof event !== 'undefined' && event && event.target) ? event.target.closest('button') : null;
  const origHTML = btn ? btn.innerHTML : '';
  if (btn) { btn.innerHTML = ICONS.check; btn.disabled = true; }
  try {
    const node = document.createElement('div');
    node.style.cssText = 'width:480px;padding:40px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:20px;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;position:fixed;left:0;top:0;z-index:-1;opacity:1;pointer-events:none;';
    node.innerHTML = `
      <div style="font-size:12px;opacity:0.8;margin-bottom:8px;">PromptCard</div>
      <div style="font-size:22px;font-weight:600;margin-bottom:16px;">${escapeHtml(c.title)}</div>
      <div style="font-size:14px;line-height:1.7;white-space:pre-wrap;max-height:320px;overflow:hidden;opacity:0.95;">${escapeHtml((c.content || '').slice(0, 400))}</div>
      <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;">${(c.tags || []).map(tag => `<span style="background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:12px;font-size:11px;">#${escapeHtml(tag)}</span>`).join('')}</div>
      <div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.2);font-size:11px;opacity:0.7;">github.com/yourname/promptcard</div>
    `;
    document.body.appendChild(node);
    // Wait for browser to paint the node before capturing
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 50));
    const dataUrl = await htmlToImage.toPng(node, {
      pixelRatio: 2,
      width: 480,
      height: node.scrollHeight,
      backgroundColor: '#667eea'
    });
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `promptcard-${c.id}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    document.body.removeChild(node);
  } catch (err) {
    console.error('shareImage error:', err);
    alert(t('shareImageError') || 'Failed to generate image');
    const node = document.querySelector('div[style*="linear-gradient(135deg,#667eea"]');
    if (node) document.body.removeChild(node);
  } finally {
    if (btn) { btn.innerHTML = origHTML; btn.disabled = false; }
  }
};

window.editCard = (id) => {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  editingId = c.id;
  document.getElementById('fTitle').value = c.title || '';
  document.getElementById('fContent').value = c.content || '';
  document.getElementById('fDesc').value = c.description || '';
  document.getElementById('fModel').value = c.model || '';
  editingTags = [...(c.tags || [])];
  const et = document.getElementById('editorTitle');
  et.textContent = t('editCardTitle');
  et.dataset.mode = 'edit';
  renderEditorTags();
  document.getElementById('editor').classList.remove('hidden');
  document.getElementById('editor').classList.add('flex');
};

let _pendingDeleteId = null;

window.deleteCard = (id) => {
  _pendingDeleteId = id;
  const modal = document.getElementById('deleteModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
};

function closeDeleteModal() {
  _pendingDeleteId = null;
  const modal = document.getElementById('deleteModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

async function confirmDeleteCard() {
  if (!_pendingDeleteId) return;
  const id = _pendingDeleteId;
  closeDeleteModal();
  await dbDelete(id);
  loadCards();
  showToast(t('deleted'));
}

function openNew() {
  editingId = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fContent').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fModel').value = '';
  editingTags = [];
  const et = document.getElementById('editorTitle');
  et.textContent = t('newCardTitle');
  et.dataset.mode = 'new';
  renderEditorTags();
  const ed = document.getElementById('editor');
  ed.classList.remove('hidden');
  ed.classList.add('flex');
}

function closeEditor() {
  const ed = document.getElementById('editor');
  ed.classList.add('hidden');
  ed.classList.remove('flex');
}

function renderEditorTags() {
  const el = document.getElementById('fTags');
  el.innerHTML = editingTags.map(tag => `
    <span class="px-2.5 py-1 bg-violet-50 text-violet-700 rounded-full text-xs flex items-center gap-1">
      #${escapeHtml(tag)}
      <button onclick="removeTag('${escapeAttr(tag)}')">${ICONS.x}</button>
    </span>
  `).join('');
}

window.removeTag = (tag) => {
  editingTags = editingTags.filter(x => x !== tag);
  renderEditorTags();
};

function addTag() {
  const input = document.getElementById('fTagInput');
  const tag = input.value.trim();
  if (tag && !editingTags.includes(tag)) editingTags.push(tag);
  input.value = '';
  renderEditorTags();
}

async function save() {
  const title = document.getElementById('fTitle').value.trim();
  const content = document.getElementById('fContent').value.trim();
  const description = document.getElementById('fDesc').value.trim();
  const model = document.getElementById('fModel').value.trim();
  if (!title || !content) { alert(t('titleRequired')); return; }

  const ts = now();
  const existing = cards.find(c => c.id === editingId);
  const card = {
    id: editingId || genId(),
    title, content, description, tags: editingTags, model,
    created_at: existing ? existing.created_at : ts,
    updated_at: ts,
    versions: existing ? [...(existing.versions || []), { content: existing.content, created_at: ts }] : [],
  };

  await dbPut(card);
  closeEditor();
  loadCards();
}

// ===== 导入导出 =====
async function exportCards() {
  const all = await dbAll();
  const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `promptcard-export-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importCards(file) {
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : data.cards;
    if (!Array.isArray(arr)) throw new Error('bad format');
    for (const c of arr) {
      if (!c.title || !c.content) continue;
      await dbPut({
        id: c.id || genId(),
        title: c.title, content: c.content,
        description: c.description || '', tags: c.tags || [], model: c.model || '',
        created_at: c.created_at || now(), updated_at: c.updated_at || now(),
        versions: c.versions || [],
      });
    }
    alert(t('importOk', arr.length));
    loadCards();
  } catch {
    alert(t('importFail'));
  }
}

// ===== 种子数据（英文）=====

  const all = await dbAll();
  if (all.length > 0) return;

  const ts = Date.now();
  const seeds = [
    { id: 'seed-1', title: 'Universal Writing Assistant', content: 'You are a seasoned content creator. Write a high-quality article based on the following topic:\n\nTopic: {topic}\n\nRequirements:\n1. Clear structure, well-defined paragraphs\n2. Vivid language, avoid clichés\n3. Keep it around {words} words\n4. End with a memorable, shareable quote', description: 'Fill in the topic and word count to generate a well-structured article', tags: ['writing', 'general', 'content'], model: 'GPT-4', created_at: ts - 86400000 * 3, updated_at: ts - 3600000 * 2, versions: [] },
    { id: 'seed-2', title: 'Code Review Expert', content: 'You are a strict code reviewer. Review the following code and give feedback on these dimensions:\n\n1. Potential bugs and edge cases\n2. Performance optimization points\n3. Readability and naming\n4. Security risks\n\nCode:\n```{lang}\n{code}\n```', description: 'Paste code and get multi-dimensional review feedback', tags: ['coding', 'review', 'dev'], model: 'Claude 3.5', created_at: ts - 86400000 * 2, updated_at: ts - 3600000 * 5, versions: [] },
    { id: 'seed-3', title: 'Weekly Report Generator', content: 'Help me organize the following scattered work items into a well-structured weekly report:\n\n- List completed items this week\n- Mark progress percentage for each\n- Highlight 1-2 key wins\n- List next week\'s plan\n\nMy work items:\n{items}', description: 'Turn fragmented work notes into a clean weekly report', tags: ['work', 'report', 'productivity'], model: 'DeepSeek', created_at: ts - 86400000, updated_at: ts - 3600000, versions: [] },
    { id: 'seed-4', title: 'Socratic Questioning Mentor', content: 'I want to learn about {topic}. Do not give me direct answers. Instead, guide me with Socratic questioning — ask only one question at a time, wait for my answer, then ask the next. Lead me from shallow to deep understanding of this topic.', description: 'No spoon-feeding — use questions to help you deeply learn any topic', tags: ['learning', 'education', 'general'], model: 'Claude 3.5', created_at: ts - 86400000 * 5, updated_at: ts - 86400000, versions: [] },
    { id: 'seed-5', title: 'Product Copy Optimizer', content: 'You are a senior product copywriter. Optimize the following product copy with these requirements:\n1. Highlight user pain points\n2. Start with verbs, avoid adjective stacking\n3. Keep each sentence under 10 words\n4. Provide 3 alternative versions\n\nOriginal copy:\n{text}', description: 'Polish mediocre product descriptions into conversion-driven copy', tags: ['copywriting', 'product', 'marketing'], model: 'GPT-4', created_at: ts - 86400000 * 4, updated_at: ts - 7200000, versions: [] },
    { id: 'seed-6', title: 'Reading Comprehension Assistant', content: 'Read the following content, then:\n1. Summarize the core point in one sentence\n2. List 3 key arguments\n3. Identify the author\'s hidden assumptions\n4. Provide a counterpoint\n\nContent:\n{text}', description: 'Not just a summary — build your critical reading skills', tags: ['learning', 'reading', 'general'], model: '', created_at: ts - 86400000 * 6, updated_at: ts - 86400000 * 2, versions: [] },

// ===== 事件绑定 =====
document.getElementById('btnNew').onclick = openNew;
document.getElementById('btnExport').onclick = exportCards;
document.getElementById('btnImport').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => { if (e.target.files[0]) importCards(e.target.files[0]); e.target.value = ''; };
document.getElementById('btnSave').onclick = save;
document.getElementById('btnAddTag').onclick = addTag;
document.getElementById('fTagInput').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } };
document.getElementById('search').oninput = (e) => { search = e.target.value; render(); };
document.getElementById('btnLang').onclick = switchLang;
document.querySelectorAll('[data-close]').forEach(el => el.onclick = closeEditor);
document.getElementById('btnDeleteConfirm').onclick = confirmDeleteCard;
document.querySelectorAll('[data-close-delete]').forEach(el => el.onclick = closeDeleteModal);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('deleteModal').classList.contains('hidden')) {
    closeDeleteModal();
  }
});

// ===== 启动 =====
applyI18n();
openDB().then(async () => {
  await seedIfEmpty();
  await loadCards();
});
</script>
